; Node cua chay pin (door-02), ESP32-C3 SuperMini.

[platformio]
; Thieu dong nay thi "pio run -t upload" nap LAN LUOT moi env (c3 roi dodong).
default_envs = c3

[env:c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = time

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7

upload_port  = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_CC:68:C7:F6:B5:94-if00 
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_CC:68:C7:F6:B5:94-if00

; Sketch do dong buoc 6-7: pio run -e dodong -t upload
[env:dodong]
extends = env:c3
build_src_filter = -<*> +<../bringup/09-mc3-do-dong.cpp>
lib_deps =
