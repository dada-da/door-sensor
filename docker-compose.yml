services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: ds-mosquitto
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT qua WebSocket, dự phòng cho dashboard nối thẳng broker
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ds-postgres
    environment:
      POSTGRES_DB: doorsensor
      POSTGRES_USER: doorsensor
      POSTGRES_PASSWORD: doorsensor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doorsensor -d doorsensor"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-log:
  postgres-data:
