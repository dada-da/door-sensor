; Node coi bao dong (siren-01), ESP32-C3 SuperMini, cam dien USB.
; Project rieng, khong dung chung voi firmware/ cua door-02.

[platformio]
; Thieu dong nay thi "pio run -t upload" nap LAN LUOT moi env (c3 roi scan).
default_envs = c3

[env:c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = time

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7

upload_port  = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_9C:CC:01:81:F8:CC-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_9C:CC:01:81:F8:CC-if00

; Sketch bringup: pio run -e scan -t upload
[env:scan]
extends = env:c3
build_src_filter = -<*> +<../bringup/01-i2c-scan.cpp>
lib_deps =
