spring:
  application:
    name: door-sensor
  datasource:
    url: jdbc:postgresql://localhost:5432/doorsensor
    username: doorsensor
    password: doorsensor
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

app:
  mqtt:
    broker-url: tcp://localhost:1883
    client-id: door-sensor-backend
    username: ''
    password: ''
    state-topic: home/door/+/state
    status-topic: home/door/+/status
    qos: 1
    automatic-reconnect: true
    clean-session: true
    connection-timeout-seconds: 10
    keep-alive-seconds: 30
  device:
    offline-after-seconds: 840
    watchdog-interval-ms: 30000
  cors:
    allowed-origins: 'http://localhost:5173,http://localhost:4173'

  # Du lieu moi truong (AHT20 tren node coi). Client MQTT rieng, broker dung chung app.mqtt.
  env:
    enabled: true
    telemetry-topic: home/env/+/telemetry
    qos: 1

  # Bao dong chay that. Lich bao ve nam trong bang alarm_schedule, khong o day.
  alarm:
    enabled: true
    siren-id: siren-01
    qos: 1
    # Firmware coi gui nhip bao (state) moi 60 giay. Gap 5 lan de chiu duoc vai lan mat goi.
    siren-offline-after-seconds: 300
    # Cho them truoc khi gui Telegram, chong bao nham khi nhay diem phat Wi-Fi.
    siren-offline-grace-seconds: 60
    ack-timeout-seconds: 10
    tick-ms: 10000
    # Tu thu coi moi ngay, "-" la tat. Vi du 18h55 hang ngay: '0 55 18 * * *'
    self-test-cron: '-'

  notify:
    enabled: false

    telegram:
      bot-token: ''
      chat-id: ''

    door-open:
      enabled: true
      min-interval-seconds: 60
      only-during-quiet-hours: false

    offline:
      enabled: true
      grace-seconds: 180

    battery:
      enabled: true
      threshold-mv: 3500
      rearm-above-mv: 3700
      cooldown-hours: 12

    quiet-hours:
      start: '22:00'
      end: '06:00'
      zone: 'Asia/Ho_Chi_Minh'

logging:
  level:
    dev.dada.doorsensor: DEBUG
    org.eclipse.paho: INFO
